syntax = "proto3";
package cortex.axon;
import "common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cortexapps/axon";

service AxonAgent {
  rpc RegisterHandler(RegisterHandlerRequest) returns (RegisterHandlerResponse);
  rpc UnregisterHandler(UnregisterHandlerRequest) returns (UnregisterHandlerResponse);
  rpc ListHandlers(ListHandlersRequest) returns (ListHandlersResponse);
  rpc GetHandlerHistory(GetHandlerHistoryRequest) returns (GetHandlerHistoryResponse);
  rpc Dispatch (stream DispatchRequest) returns (stream DispatchMessage);  
  rpc ReportInvocation(ReportInvocationRequest) returns (ReportInvocationResponse);

  // DispatchEvents sends the client every failed invocation, and the client
  // answers each with what to do about it. It is its own stream so a client
  // that has stopped reading Dispatch because every handler is busy still
  // hears about failures. An event the client has not answered when the
  // stream ends is sent again on the next one.
  rpc DispatchEvents(stream DispatchEventsRequest) returns (stream DispatchEvent);
}



//
// Handler Registration
//

message RegisterHandlerRequest {
  string dispatch_id = 1;
  string handler_name = 2;
  int32 timeout_ms = 3;
  repeated HandlerOption options = 4;
}


enum HandlerInvokeType {
  INVOKE = 0;
  RUN_NOW = 1;
  CRON_SCHEDULE = 2;
  RUN_INTERVAL = 3;
  WEBHOOK = 4;
}

message HandlerInvokeOption {
  HandlerInvokeType type = 1;
  string value = 2;
}


message HandlerOption {
  oneof option {
    HandlerInvokeOption invoke = 1;
  }
}


message RegisterHandlerResponse {
  Error error = 1;
  string id = 2;
}

message UnregisterHandlerRequest {
  string id = 1;
}

message UnregisterHandlerResponse {
  Error error = 1;
}

message ListHandlersRequest {
}

message HandlerInfo {
  string name = 1;
  repeated HandlerOption options = 2;  
  string dispatch_id = 20;
  string id = 21;
  google.protobuf.Timestamp last_invoked_client_timestamp = 100;
  bool   is_active = 101;
}

message ListHandlersResponse {
  Error error = 1;
  repeated HandlerInfo handlers = 2;
}

//
// Dispatch loop
//

message DispatchRequest {
  string dispatch_id = 1;
  string client_version = 2;
  // The client handles failure events. The agent only keeps them for clients
  // that ask, so an older client never has events pile up for it.
  bool failure_events = 3;
}

message DispatchMessage {

  DispatchMessageType type = 1;

  oneof message {
    DispatchHandlerInvoke invoke = 10;
  }
}

enum DispatchMessageType {
  DISPATCH_MESSAGE_TYPE_NONE = 0;
  DISPATCH_MESSAGE_INVOKE = 1;
  DISPATCH_MESSAGE_WORK_COMPLETED = 2;
}

message DispatchHandlerInvoke{
  string invocation_id = 1;
  string dispatch_id = 2;
  string handler_id = 3;
  string handler_name = 4;
  int32  timeout_ms = 10;
  HandlerInvokeType reason = 11;
  map<string, string> args = 20;
  // 1 for the first attempt; 0 means the agent didn't say, so treat it as 1.
  int32  attempt = 30;
  // When the agent stops waiting for this invocation's result and reports
  // the failure itself. A client must not start a handler after it, since
  // the failure has already been reported. Unset from older agents.
  google.protobuf.Timestamp deadline = 31;
}

//
// Failure events
//

enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  // The handler returned an error or raised.
  HANDLER_ERROR = 1;
  // The invocation did not finish within its timeout.
  TIMEOUT = 2;
  // The invocation could not be dispatched: the queue was full, or it expired
  // while waiting for a free handler.
  NO_RESOURCES = 3;
}

enum FailureSource {
  FAILURE_SOURCE_UNSPECIFIED = 0;
  // The failure came from handler code.
  APPLICATION = 1;
  // The failure came from Axon: the agent, the SDK, or a Cortex API call.
  RUNTIME = 2;
}

message InvocationFailure {
  FailureReason reason = 1;
  FailureSource source = 2;
  string message = 3;
  // Whoever submitted the invocation was told it was not accepted (e.g. a
  // webhook sender got a 503), so it may be sent again.
  bool caller_rejected = 4;
}

message DispatchEvent {
  DispatchHandlerInvoke invoke = 1;
  InvocationFailure failure = 2;
}

enum FailureAction {
  // Treated as DROP.
  FAILURE_ACTION_UNSPECIFIED = 0;
  // Do nothing more with the invocation.
  FAILURE_ACTION_DROP = 1;
  // Queue the invocation again as its next attempt.
  FAILURE_ACTION_RETRY = 2;
}

message FailureResolution {
  string invocation_id = 1;
  FailureAction action = 2;
}

message DispatchEventsRequest {
  // Identifies the client on the first message of the stream.
  string dispatch_id = 1;
  string client_version = 2;
  // The client's answer to a DispatchEvent; unset on the first message.
  FailureResolution resolution = 3;
}

//
// Invocation Reporting
//

message Log {
  string level = 1;
  google.protobuf.Timestamp timestamp = 2;
  string message = 3;
}

message ReportInvocationRequest {
  DispatchHandlerInvoke handler_invoke = 1;
  google.protobuf.Timestamp start_client_timestamp = 100;
  int32  duration_ms = 101;
  oneof message {
    InvokeResult result = 200;
    Error error = 201;
  }
  // Why the invocation failed, from a client that classifies its failures.
  // The agent passes it on as a failure event; an error without it is only
  // recorded.
  InvocationFailure failure = 202;
  repeated Log logs = 300;
}

message ReportInvocationResponse {
  Error error = 1;
}

message InvokeResult {
  string value = 10;  
}

// 
// History
//

message GetHandlerHistoryRequest {
  string handler_name = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  bool include_logs = 4;
  int32 tail = 5;
}

message HandlerExecution {
  string handler_name = 1;
  string handler_id = 2;
  string invocation_id = 3;
  string dispatch_id = 4;
  google.protobuf.Timestamp publish_server_timestamp = 10;
  google.protobuf.Timestamp receive_server_timestamp = 11;
  google.protobuf.Timestamp start_client_timestamp = 12;
  int32  duration_ms = 13;
  Error error = 20;
  repeated Log logs = 30;
}

message GetHandlerHistoryResponse {
  Error error = 1;
  repeated HandlerExecution history = 2;
}
# Front door for a pod that serves both relay transports.
#
# The demux rule is deliberately one-sided: match the gRPC tunnel's own
# method prefix and send everything else to snyk-broker. That prefix is a
# generated constant from our proto package, so it is ours to keep stable —
# whereas snyk-broker's paths belong to a vendored Node app whose routes we
# do not control. Matching on what we own and defaulting to what we do not
# means a new snyk-broker path cannot silently land on the wrong backend.
#
# The reverse rule — enumerate /primus/* and default to gRPC — fails the
# first time snyk-broker adds a route.

events {}

http {
    # Paths and negotiated protocol, so a run tells us what each transport
    # actually asked for rather than what we assumed.
    log_format demux '$remote_addr "$request" proto=$server_protocol '
                     'upstream=$upstream_addr status=$status ct=$http_content_type';
    access_log /dev/stdout demux;
    error_log /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Dispatch (Cortex -> server) is the one direction the protocol cannot
    # disambiguate: both servers serve /broker/{token}/..., so the token has
    # to say which backend owns it. Static here because the spike knows both
    # tokens; see MULTIPLEXING.md for what production needs instead.
    map $uri $dispatch_backend {
        default                  "http://snyk_dispatch";
        ~^/broker/tok-grpc/      "http://grpc_dispatch";
    }

    # Named upstreams rather than hostnames in the map. A hostname inside a
    # proxy_pass variable is resolved per request and needs a resolver;
    # upstream blocks resolve once at config load, which is also why
    # grpc_pass below has always worked.
    upstream grpc_tunnel  { server grpc-tunnel-server:50052; }
    upstream grpc_dispatch { server grpc-tunnel-server:8080; }
    upstream snyk_dispatch { server snyk-broker:7341; }

    # Docker's embedded DNS, so any name that does need runtime resolution
    # can still be resolved instead of failing with an opaque 502.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        # h2c and HTTP/1.1 share this port: nginx detects the HTTP/2 preface,
        # so gRPC and websocket clients can use the same address. Requires
        # nginx >= 1.25.1 for the `http2` directive.
        listen 8080;
        http2 on;

        # gRPC agents. The full method is
        # /cortex.axon.tunnel.v2.TunnelService/Tunnel; matching the package
        # prefix keeps future methods on the same service working.
        location /cortex.axon.tunnel.v2. {
            grpc_pass grpc://grpc_tunnel;
            grpc_read_timeout 1h;
            grpc_send_timeout 1h;
        }

        # Inbound dispatch, routed by which backend owns the token.
        location /broker/ {
            proxy_pass $dispatch_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5m;
            proxy_buffering off;
        }

        # Everything else is snyk-broker's: the primus websocket, its
        # handshake, and any route the vendored app adds later.
        location / {
            proxy_pass http://snyk-broker:7341;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }
    }
}

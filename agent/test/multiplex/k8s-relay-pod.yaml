# A pod serving both relay transports, derived from the docker-compose spike
# in this directory. See MULTIPLEXING.md for why the routing is shaped this
# way and what was measured to get there.
#
# Shape:
#   agents  -> relay-ingress Service -> nginx -> snyk-broker | tunnel server
#   Cortex  -> per-server dispatch Services, addressed directly
#
# Agent traffic is multiplexed because the protocols distinguish themselves.
# Dispatch is not, because both servers own /broker/{token}/... and only the
# token says which holds it — so dispatch gets a Service per server and Cortex
# addresses the right one from what the connect notifications already told it.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-nginx
data:
  nginx.conf: |
    events {}

    http {
      log_format demux '$remote_addr "$request" proto=$server_protocol '
                       'upstream=$upstream_addr status=$status';
      access_log /dev/stdout demux;
      error_log  /dev/stderr warn;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      # Named upstreams, not hostnames in a variable: these resolve once at
      # config load. A hostname inside a proxy_pass variable needs per-request
      # DNS and fails with an opaque 502 without a resolver.
      upstream grpc_tunnel { server 127.0.0.1:50052; }
      upstream snyk_broker { server 127.0.0.1:7341; }

      server {
        # h2c and HTTP/1.1 on one port: nginx detects the HTTP/2 preface, so
        # gRPC and primus share an address. Needs nginx >= 1.25.1.
        listen 8080;
        http2 on;

        # Our own generated method prefix. Everything not matching this is
        # snyk-broker's — including /response-data/*, which is NOT under
        # /primus and would break the response path if routed to gRPC.
        location /cortex.axon.tunnel.v2. {
          grpc_pass grpc://grpc_tunnel;
          grpc_read_timeout 1h;
          grpc_send_timeout 1h;
        }

        location / {
          proxy_pass http://snyk_broker;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          # Both transports hold connections open. The 60s default would cut
          # idle tunnels and websockets.
          proxy_read_timeout 1h;
          proxy_send_timeout 1h;
          proxy_buffering off;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  labels: {app: relay}
spec:
  replicas: 2
  selector:
    matchLabels: {app: relay}
  template:
    metadata:
      labels: {app: relay}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - {name: agents, containerPort: 8080}
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 5

        - name: tunnel-server
          image: ghcr.io/cortexapps/cortex-axon-tunnel-server:latest
          ports:
            - {name: grpc, containerPort: 50052}
            - {name: grpc-http, containerPort: 8081}
          env:
            - {name: GRPC_PORT, value: "50052"}
            - {name: HTTP_PORT, value: "8081"}
            - {name: SERVER_ID, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: HEARTBEAT_INTERVAL, value: "30s"}
            - {name: DISPATCH_TIMEOUT, value: "60s"}
          # Probed directly rather than through nginx, so an nginx fault is
          # not misread as a backend fault. /healthz also reports the
          # connected stream count, which is the only way to see gRPC
          # routing — long-lived streams never appear in nginx access logs.
          readinessProbe:
            httpGet: {path: /healthz, port: grpc-http}
            initialDelaySeconds: 3
            periodSeconds: 10

        - name: snyk-broker
          image: ghcr.io/cortexapps/cortex-snyk-broker-server:latest
          ports:
            - {name: snyk-http, containerPort: 7341}
          readinessProbe:
            httpGet: {path: /healthcheck, port: snyk-http}
            initialDelaySeconds: 3
            periodSeconds: 10

      volumes:
        - name: nginx-conf
          configMap: {name: relay-nginx}
---
# Agent-facing ingress. Both transports connect here; nginx demuxes.
apiVersion: v1
kind: Service
metadata:
  name: relay-ingress
spec:
  selector: {app: relay}
  ports:
    - {name: agents, port: 443, targetPort: agents}
---
# Dispatch, one Service per server. Cortex addresses these directly using the
# server identity it already learns from client-connected notifications, so
# nothing has to map tokens to transports at the ingress.
apiVersion: v1
kind: Service
metadata:
  name: relay-dispatch-tunnel
spec:
  selector: {app: relay}
  ports:
    - {name: dispatch, port: 80, targetPort: grpc-http}
---
apiVersion: v1
kind: Service
metadata:
  name: relay-dispatch-snyk
spec:
  selector: {app: relay}
  ports:
    - {name: dispatch, port: 80, targetPort: snyk-http}
---
# TLS terminates here. ALPN negotiates h2 for gRPC and http/1.1 for primus,
# so the same demux applies inside nginx.
#
# NOTE: nginx-ingress applies backend-protocol per Ingress object, so the gRPC
# path needs its own Ingress with GRPC set. Both point at the same Service —
# it is the annotation, not the backend, that differs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay-agents-http
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: relay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relay-ingress
                port: {name: agents}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay-agents-grpc
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: relay.example.com
      http:
        paths:
          - path: /cortex.axon.tunnel.v2.
            pathType: Prefix
            backend:
              service:
                name: relay-ingress
                port: {name: agents}

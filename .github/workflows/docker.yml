name: Build and Publish Docker Image

on: 
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    # labeled/unlabeled so that adding or removing bypass-trivy-fail takes
    # effect. A re-run alone does not, because it reuses the original
    # event's labels.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  # cortex-axon-agent:<tag> -- both relay transports (snyk-broker and grpc-tunnel).
  # Skipped for a -grpc release tag: semver would read v0.3.10-grpc as a
  # prerelease and publish the full image as 0.3.10-grpc.
  full:
    name: Agent image (full)
    if: ${{ !(startsWith(github.ref, 'refs/tags/') && endsWith(github.ref, '-grpc')) }}
    # A called workflow cannot hold a permission its caller did not grant:
    # push to ghcr, and upload Trivy SARIF from both scan jobs.
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-image.yml
    with:
      variant: full
      tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
    secrets: inherit

  # cortex-axon-agent:<version>-grpc -- go-only: no Node or snyk-broker, and the
  # binary is pinned to AXON_RELAY_TRANSPORT=grpc-tunnel. Every release tag
  # publishes it next to the full image: v0.3.11 publishes 0.3.11 (full) and
  # 0.3.11-grpc. A v0.3.10-grpc tag publishes only this one, as 0.3.10-grpc,
  # which lets a go-only build go out without re-releasing the others. A push
  # to main publishes main-grpc. PRs build and scan it without publishing.
  #
  # Intermediate stage: once snyk-broker is fully deprecated, the full image
  # becomes go-only and this variant (and every -grpc tag) collapses back into
  # it.
  grpc:
    name: Agent image (go-only)
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-image.yml
    with:
      variant: grpc
      # The optional (-grpc) group strips a -grpc tag's own suffix so the
      # flavor suffix is not applied twice (0.3.10-grpc-grpc).
      #
      # latest-grpc moves with the full image's latest: only on a plain v*
      # release tag. A one-off v*-grpc tag (often an older version) leaves it
      # alone so it cannot roll latest-grpc backwards. latest=false turns off
      # the auto latest, which would fire on both; onlatest makes the explicit
      # one latest-grpc rather than overwriting the full image's latest.
      tags: |
        type=match,pattern=^v(.*?)(-grpc)?$,group=1
        type=ref,event=branch
        type=ref,event=pr
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !endsWith(github.ref, '-grpc') }}
      flavor: |
        latest=false
        suffix=-grpc,onlatest=true
      suffix: -grpc
    secrets: inherit

  # cortex-axon-agent:<tag>-node22 -- the full image (both transports,
  # snyk-broker included) on Node 22 instead of 20, published in parallel so it
  # can be trialled before anything moves. Node 20 is end of life and will not
  # get the CVE-2026-111497 fix; 22.23.4 has it, and the build fails if
  # NodeSource serves anything older. Same tag set as the full image, each with
  # -node22 appended: 0.3.11-node22, 0.3-node22, latest-node22, main-node22.
  node22:
    name: Agent image (Node 22)
    if: ${{ !(startsWith(github.ref, 'refs/tags/') && endsWith(github.ref, '-grpc')) }}
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-image.yml
    with:
      variant: full
      build-args: |
        NODE_VERSION=22
        NODE_MIN_VERSION=22.23.4
      tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=sha
      # latest stays auto, as for the full image; onlatest makes it
      # latest-node22 instead of overwriting the full image's latest.
      flavor: |
        suffix=-node22,onlatest=true
      suffix: -node22
    secrets: inherit

  # `build` is a required status check on main, named after the single job
  # this workflow used to have. The image jobs above now report as
  # "Agent image (full) / build" etc., so without this the required check
  # never reports and every PR sits blocked. It passes only when every image
  # job that ran passed; a job skipped by its `if` (e.g. full on a -grpc tag)
  # does not count against it.
  build:
    needs: [full, grpc, node22]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: All agent images built
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "image job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::an agent image job finished with: $r"; exit 1 ;;
            esac
          done

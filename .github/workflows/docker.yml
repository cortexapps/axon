name: Build and Publish Docker Image

on: 
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    # labeled/unlabeled so that adding or removing bypass-trivy-fail takes
    # effect. A re-run alone does not, because it reuses the original
    # event's labels.
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  agent:
    name: Agent image
    uses: ./.github/workflows/docker-image.yml
    with:
      target: agent
      category: trivy-cortex-axon-agent
    secrets: inherit

  grpc:
    name: Agent image (gRPC only)
    uses: ./.github/workflows/docker-image.yml
    with:
      target: grpc
      tag-suffix: -grpc
      latest: 'false'
      category: trivy-cortex-axon-agent-grpc
    secrets: inherit

# Builds, publishes and scans one variant of the agent image. docker.yml calls
# this once per variant; the variants share one package and differ by tag suffix.
name: Docker Image

on:
  workflow_call:
    inputs:
      target:
        description: Dockerfile stage to build.
        required: true
        type: string
      tag-suffix:
        description: Suffix added to every tag, such as "-grpc". Empty for the default image.
        required: false
        type: string
        default: ''
      latest:
        description: metadata-action latest flavor. Use "false" for a suffixed variant so it never moves the latest tag.
        required: false
        type: string
        default: auto
      category:
        description: SARIF category, unique per variant.
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', 'main') }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
      IS_PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/') }}
      # ARM64 builds via QEMU are slow - only build on main/tags, not workflow_dispatch
      IS_ARM64_BUILD: ${{ github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ inputs.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ inputs.target }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      -   name: Docker meta
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: |
              ghcr.io/${{ github.repository_owner }}/cortex-axon-agent
            flavor: |
              latest=${{ inputs.latest }}
              suffix=${{ inputs.tag-suffix }}
            tags: |
              type=ref,event=branch
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./docker/Dockerfile
          target: ${{ inputs.target }}
          push: ${{ env.IS_PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}-${{ github.sha }}
          # arm64 via QEMU is slow, so only build it on main branch or tags (not workflow_dispatch)
          platforms: ${{ env.IS_ARM64_BUILD == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          load: ${{ env.IS_PUBLISH != 'true' }}

      - name: Determine local image tag
        if: env.IS_PUBLISH != 'true'
        id: local-tag
        run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Save Docker image for scanning
        if: env.IS_PUBLISH != 'true'
        run: docker save '${{ steps.local-tag.outputs.tag }}' -o /tmp/docker-image.tar

      - name: Upload Docker image artifact
        if: env.IS_PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ inputs.target }}
          path: /tmp/docker-image.tar
          retention-days: 1

    outputs:
      image-tag: ${{ steps.local-tag.outputs.tag }}
      # The primary tag metadata-action resolved -- the semver version on a
      # tag build, the branch name on main. The release scan targets this
      # rather than a hardcoded :main, so a tag build reports on the image
      # that tag actually published.
      published-ref: ghcr.io/${{ github.repository_owner }}/cortex-axon-agent:${{ steps.meta.outputs.version }}

  trivy-pr:
    name: Run Trivy PR scan (local image)
    needs: build
    if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ inputs.target }}
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/docker-image.tar

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          skip-dirs: 'usr/local/go'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.32.2
        with:
          sarif_file: 'trivy-results.sarif'
          # Matches the release scan's category so PR and post-merge findings
          # for this image track one series instead of churning against
          # each other in the Security tab.
          category: ${{ inputs.category }}

      # The bypass-trivy-fail label lets a PR merge past CVEs it did not
      # introduce. The findings are still uploaded above and listed here.
      - name: Fail on CRITICAL/HIGH vulnerabilities
        env:
          BYPASS: ${{ contains(github.event.pull_request.labels.*.name, 'bypass-trivy-fail') }}
        run: |
          COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' trivy-results.sarif)
          if [ "$COUNT" -gt 0 ]; then
            LEVEL=error
            if [ "$BYPASS" = "true" ]; then LEVEL=warning; fi
            echo "::$LEVEL::Found $COUNT CRITICAL/HIGH fixable vulnerabilities:"
            jq -r '.runs[].results[] | select(.level == "error") | "\(.ruleId): \(.message.text | split("\n") | .[0])"' trivy-results.sarif
            if [ "$BYPASS" = "true" ]; then
              echo "::warning::Not failing: the PR has the bypass-trivy-fail label."
              exit 0
            fi
            exit 1
          fi

  trivy:
    name: Run Trivy Container scan
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image-ref: ${{ needs.build.outputs.published-ref }}
      category: ${{ inputs.category }}
    secrets: inherit

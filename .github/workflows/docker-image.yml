# Builds, publishes and scans one variant of the agent image. docker.yml calls
# this once per variant so both flavors share one build definition: a second
# inlined copy is how two images drift into one being scanned and the other
# not (see trivy-scan.yml).
name: Agent Image

on:
  workflow_call:
    inputs:
      variant:
        description: VARIANT build arg for docker/Dockerfile (full or grpc).
        required: true
        type: string
      tags:
        description: docker/metadata-action `tags` spec for this variant.
        required: true
        type: string
      flavor:
        description: docker/metadata-action `flavor` spec for this variant.
        required: false
        type: string
        default: ''
      build-args:
        description: >-
          Extra docker/Dockerfile build args, one KEY=value per line, e.g.
          NODE_VERSION=22 for the -node22 image.
        required: false
        type: string
        default: ''
      suffix:
        description: >-
          Keeps this variant's PR artifact and SARIF category apart from the
          full image's. Empty for the full image, so its scan history is
          unchanged.
        required: false
        type: string
        default: ''

# Each job states what it needs below.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', 'main') }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
      IS_PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/') }}
      # ARM64 builds via QEMU are slow - only build on main/tags, not workflow_dispatch
      IS_ARM64_BUILD: ${{ github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ inputs.variant }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ inputs.variant }}-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      -   name: Docker meta
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: |
              ghcr.io/${{ github.repository_owner }}/cortex-axon-agent
            tags: ${{ inputs.tags }}
            flavor: ${{ inputs.flavor }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./docker/Dockerfile
          push: ${{ env.IS_PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}-${{ github.sha }}
            VARIANT=${{ inputs.variant }}
            ${{ inputs.build-args }}
          # arm64 via QEMU is slow, so only build it on main branch or tags (not workflow_dispatch)
          platforms: ${{ env.IS_ARM64_BUILD == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          load: ${{ env.IS_PUBLISH != 'true' }}

      - name: Determine local image tag
        if: env.IS_PUBLISH != 'true'
        id: local-tag
        run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Save Docker image for scanning
        if: env.IS_PUBLISH != 'true'
        run: docker save '${{ steps.local-tag.outputs.tag }}' -o /tmp/docker-image.tar

      - name: Upload Docker image artifact
        if: env.IS_PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image${{ inputs.suffix }}
          path: /tmp/docker-image.tar
          retention-days: 1

    outputs:
      image-tag: ${{ steps.local-tag.outputs.tag }}
      # The primary tag metadata-action resolved -- the semver version on a
      # tag build, the branch name on main. The go-only image publishes a
      # single tag per release, <version>-grpc (0.3.11-grpc from v0.3.11 or
      # v0.3.11-grpc), and main-grpc on main, so this is that tag. The release scan
      # targets this rather than a hardcoded :main, so a tag build reports on
      # the image that tag actually published.
      published-ref: ghcr.io/${{ github.repository_owner }}/cortex-axon-agent:${{ steps.meta.outputs.version }}

  trivy-pr:
    name: Run Trivy PR scan (local image)
    needs: build
    if: ${{ !(github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image${{ inputs.suffix }}
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/docker-image.tar

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          skip-dirs: 'usr/local/go'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.32.2
        with:
          sarif_file: 'trivy-results.sarif'
          # Matches the release scan's category so PR and post-merge findings
          # for this image track one series instead of churning against
          # each other in the Security tab.
          category: trivy-cortex-axon-agent${{ inputs.suffix }}

      # The bypass-trivy-fail label lets a PR merge past CVEs it did not
      # introduce. The findings are still uploaded above and listed here.
      - name: Fail on CRITICAL/HIGH vulnerabilities
        env:
          BYPASS: ${{ contains(github.event.pull_request.labels.*.name, 'bypass-trivy-fail') }}
        run: |
          COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' trivy-results.sarif)
          if [ "$COUNT" -gt 0 ]; then
            LEVEL=error
            if [ "$BYPASS" = "true" ]; then LEVEL=warning; fi
            echo "::$LEVEL::Found $COUNT CRITICAL/HIGH fixable vulnerabilities:"
            jq -r '.runs[].results[] | select(.level == "error") | "\(.ruleId): \(.message.text | split("\n") | .[0])"' trivy-results.sarif
            if [ "$BYPASS" = "true" ]; then
              echo "::warning::Not failing: the PR has the bypass-trivy-fail label."
              exit 0
            fi
            exit 1
          fi

  trivy:
    name: Run Trivy Container scan
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image-ref: ${{ needs.build.outputs.published-ref }}
      category: trivy-cortex-axon-agent${{ inputs.suffix }}
    secrets: inherit

# Daily sweep of what main is currently shipping, for both images.
#
# This catches CVEs disclosed after a build; the per-release scan happens in
# docker.yml and tunnel-server-image.yml, which scan the exact tag they just
# published rather than whatever :main happens to point at. Previously this
# workflow was also what docker.yml called on a tag build, which meant a
# release scan reported on main instead of the release.
name: Scan for Vulnerabilities

on:
  schedule:
    - cron: '45 10 * * *'
  workflow_dispatch:

jobs:
  agent:
    name: Agent image
    # Explicit rather than inherited: a called workflow cannot hold a
    # permission its caller did not grant, so these are the scan's actual
    # needs -- pull the image, upload SARIF -- and nothing else.
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image-ref: ghcr.io/${{ github.repository_owner }}/cortex-axon-agent:main
      category: trivy-cortex-axon-agent
    secrets: inherit

  tunnel-server:
    name: Tunnel server image
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/trivy-scan.yml
    with:
      image-ref: ghcr.io/${{ github.repository_owner }}/cortex-axon-tunnel-server:main
      category: trivy-cortex-axon-tunnel-server
    secrets: inherit

# Scans one published image for OS and library vulnerabilities.
#
# Reusable rather than inlined, because a second copy of these steps is exactly
# how the two images drifted into one being scanned and the other not: the
# agent had a gate, the tunnel server had none. Both release paths call this,
# and so does the scheduled sweep in trivy.yml, so there is one definition of
# what "scanned" means.
name: Trivy Scan

on:
  workflow_call:
    inputs:
      image-ref:
        description: Fully qualified image reference to scan, including tag.
        required: true
        type: string
      category:
        description: >-
          SARIF category, unique per image. Two uploads sharing a category on
          one commit overwrite each other in the Security tab, which would
          leave whichever image scanned first invisible. Keep it stable across
          PR and release runs for a given image so alerts track one series
          instead of churning.
        required: true
        type: string

permissions:
  security-events: write
  packages: read
  contents: read

jobs:
  trivy:
    name: Scan image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.image-ref }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          # The scan itself never fails the job; the explicit check below does,
          # so the SARIF still uploads on a finding rather than being skipped.
          exit-code: '0'
          # Vendored toolchains in the agent image, not shipped attack surface.
          # A no-op for images that do not contain them.
          skip-dirs: 'usr/lib/node_modules/npm,usr/local/go'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.32.2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: ${{ inputs.category }}

      - name: Fail on CRITICAL/HIGH vulnerabilities
        run: |
          COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' trivy-results.sarif)
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Found $COUNT CRITICAL/HIGH fixable vulnerabilities in ${{ inputs.image-ref }}:"
            jq -r '.runs[].results[] | select(.level == "error") | "\(.ruleId): \(.message.text | split("\n") | .[0])"' trivy-results.sarif
            exit 1
          fi

      - name: Notify Slack on failure
        if: failure()
        uses: voxmedia/github-action-slack-notify-build@v1
        with:
          channel: eng-releases
          status: FAILED
          color: danger
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_ERROR_REPORTING_BOT_TOKEN }}

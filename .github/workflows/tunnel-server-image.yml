# Publishes the gRPC tunnel server image to ghcr.io.
#
# Unlike the agent image (docker.yml), this pushes on pull requests as well
# as main. The tunnel server is deployed infrastructure, and the only way to
# exercise a change against real Cortex traffic is to deploy the image built
# from that change — so a PR needs a pullable artifact before it lands, not
# after. PR builds are tagged pr-<number> and by sha, so nothing a PR
# publishes can be mistaken for a released image.
name: Tunnel Server Image

on:
  # Every branch, not just main. The branch name is the tag you deploy by, and
  # it only exists on a push event — a pull_request build can be tagged pr-<n>
  # and by sha, but never by the branch someone is actually working on.
  #
  # Building on branch push rather than on pull_request also means one build
  # per commit instead of two. A same-repo PR pushes its branch anyway, so
  # nothing is lost. Fork PRs do not build, but they could never publish
  # either: a fork's token has no packages:write.
  push:
    branches:
      - '**'
    paths:
      - 'server/**'
      - 'proto/**'
      - '.github/workflows/tunnel-server-image.yml'
  # Release tags do NOT come in through a `tags:` filter here. This `push`
  # trigger carries a `paths:` filter, and a tag push has no file diff for
  # GitHub to evaluate that filter against, so a `tags:` entry alongside
  # `paths:` would silently never fire. tunnel-server-release.yml owns the
  # tag trigger and calls this workflow instead.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tunnel-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-tunnel-server-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tunnel-server-buildx-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/cortex-axon-tunnel-server
          # Branch name (slashes become dashes) plus the commit sha. The
          # branch tag is the handle for "deploy what I am working on"; the
          # sha tag is the one to pin, since a branch tag moves under you.
          #
          # The semver patterns only emit on a `refs/tags/v*` ref, so they are
          # inert on the branch builds above; on a release tag they give the
          # server the same `1.2.3` / `1.2` stamp the agent image gets from
          # docker.yml, which is the whole point of tagging both together.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # Only main moves the floating "latest" tag. A PR image is for
          # deliberately pinning a deployment at, never for anything that
          # resolves a tag on its own.
          flavor: |
            latest=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only: this runs on every PR touching the server, and arm64
          # via QEMU costs minutes for an image that deploys to amd64 hosts.
          platforms: linux/amd64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Summarize published tags
        run: |
          {
            echo "### Tunnel server image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

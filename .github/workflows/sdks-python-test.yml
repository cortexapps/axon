name: Python SDK Test
on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'sdks/python/**'

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install Poetry
        uses: snok/install-poetry@v1.3.4

      - name: Install Protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # The end-to-end tests build and run the real agent.
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.26.10'

      - name: Generate agent protobuf
        run: make -C agent setup proto

      - name: Run Linter
        run: |
          cd sdks/python
          make all
          make lint    

      - name: Run tests
        run: |
          cd sdks/python
          make all
          make test


relay:
  integration: # REQUIRED
  alias: # REQUIRED
  subtype:   # OPTIONAL
  env:
    # TODO: Replace these with the values for the selected
    # integration and subtype, see reference here: 
    # https://github.com/cortexapps/axon/blob/main/README.relay.md#environment-variables-summary
    #
    # GITHUB_API: "https://api.github.com"
    # GITHUB_GRAPHQL_API: "https://api.github.com/graphql"
  verbose: false # set to true to enable verbose logging

replicaCount: 2

image:
  repository: ghcr.io/cortexapps/cortex-axon-agent
  tag: latest

# Memory is tuned by sizing the container: the agent reads its own cgroup limit
# at startup and targets ~80% of it as a Go heap budget, so raising the limit
# below raises the agent's working budget with it and no separate setting has to
# be kept in step. Setting GOMEMLIMIT explicitly overrides that if you need to.
#
# The agent's peak is driven by concurrent proxied calls: each in-flight call
# holds one read buffer of the server-announced frame size (1 MiB by default),
# bounded by MAX_INFLIGHT_REQUESTS (256 by default). The 512Mi limit leaves
# roughly 2x headroom over that worst case. Raise both together if you raise
# MAX_INFLIGHT_REQUESTS for throughput.
resources:
  limits:
    memory: "512Mi"
    cpu: "500m"
  requests:
    memory: "256Mi"
    cpu: "250m"

# proxy:
#   server:  # set to the proxy server URL, e.g. http://proxy.example.com:8080
#   noProxy: # a comma-separated list of addresses to exclude from proxying
#   disableTLS: false # set to true to disable SSL verification for DEBUGGING ONLY
#   certSecretName: # name of the secret containing a .pem file with the CA certificate